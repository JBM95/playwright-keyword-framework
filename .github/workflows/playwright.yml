name: Playwright

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CONTACT_LIST_TEST_USER_EMAIL: ${{ secrets.CONTACT_LIST_TEST_USER_EMAIL }}
      CONTACT_LIST_TEST_USER_PASSWORD: ${{ secrets.CONTACT_LIST_TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
